name: publish

# 发布流水线: 打 tag (vX.Y.Z) 即触发。
# 流程: 测试 -> 构建 (sdist + Linux/macOS/Windows wheels, 各一条腿) -> Trusted Publishing 上传 PyPI。
#
# 前置条件 (一次性, 在 PyPI 配置):
#   1. 在 https://pypi.org/manage/account/publishing/ 添加 Trusted Publisher:
#      - Project: biorazer
#      - Owner: flmaximwang
#      - Repository: BioRazer
#      - Workflow name: publish.yml
#   2. 打 tag 前确保 pyproject.toml 的 version 与 tag 一致 (v0.9.0 -> 0.9.0)。
#      流水线会校验, 不一致则中止发布。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Trusted Publishing (OIDC) 需要 id-token 写权限
  id-token: write

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心依赖 (poetry 的 dev group 不是 pip extra, 这里显式装 pytest)
          pip install -e .
          pip install pytest
          # Cython 扩展编译所需 (poetry 的 build-system 也声明了, 这里确保测试环境可编译)
          pip install cython numpy

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One entry per OS: cibuildwheel can only build wheels for the platform
      # it runs on, so macOS and Windows wheels need their own runners.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64"
          - os: macos-latest        # arm64 runner; x86_64 wheels are cross-compiled
            archs: "arm64 x86_64"
          - os: windows-latest
            archs: "AMD64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build cibuildwheel

      - name: Build sdist
        # Once: three legs writing the same sdist into dist/ would collide.
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --sdist --outdir dist/

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist/
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          # Linux: x86_64 only.  The aarch64 containers are ARM images and
          # cannot run on an x86_64 runner (cibuildwheel: "exec format
          # error"); using them needs docker/setup-qemu-action (slow) or a
          # native ARM runner.  Linux/ARM installs the sdist instead.
          CIBW_ARCHS: ${{ matrix.archs }}
          # The test job already covers the suite.  Beyond that, a cross-compiled
          # x86_64 macOS wheel needs Rosetta to be tested on an arm64 runner,
          # which depends on the runner image, so it is skipped rather than
          # gambled on.
          CIBW_TEST_SKIP: "cp312-* *-macosx_x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    name: publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The tag/version check below reads pyproject.toml from the working
      # directory, which only holds dist/ unless the repository is checked out.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Check tag/version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME != pyproject version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag/version consistent: $PACKAGE_VERSION"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
