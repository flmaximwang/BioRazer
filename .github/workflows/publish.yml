name: publish

# 发布流水线: 打 tag (vX.Y.Z) 即触发。
# 流程: 构建 (sdist + 四条腿: Linux x86_64 / macOS arm64 / macOS Intel / Windows AMD64)
#       -> 逐 wheel 验证 (装进干净 venv + 跑全套 pytest) -> Trusted Publishing 上传 PyPI。
#
# CI 只验产物, 不测源码树: 纯代码测试在开发机上跑。源码树干净不等于 wheel 干净 —— 0.9.5 的
# win_amd64 wheel 少了编译产物 (.pyd), 而"跑源码树"和"修轮子"这两道旧关卡都看不见它。
#
# 前置条件 (一次性, 在 PyPI 配置):
#   1. 在 https://pypi.org/manage/account/publishing/ 添加 Trusted Publisher:
#      - Project: biorazer
#      - Owner: flmaximwang
#      - Repository: BioRazer
#      - Workflow name: publish.yml
#   2. 打 tag 前确保 pyproject.toml 的 version 与 tag 一致 (v0.9.0 -> 0.9.0)。
#      流水线会校验, 不一致则中止发布。

on:
  push:
    tags:
      - "v*"
  # 手动空跑: build + verify 会真跑, publish 有 startsWith(refs/tags/v) 条件而跳过,
  # 所以验流水线不必再切一个版本号。
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC) 需要 id-token 写权限
  id-token: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One entry per OS (and per Mac architecture): cibuildwheel can only
      # build wheels for the platform it runs on, and the macOS arch must match
      # the runner's -- poetry-core derives the wheel's platform tag from
      # packaging.tags, which reads the *host* architecture and ignores the
      # _PYTHON_HOST_PLATFORM that cibuildwheel sets for cross-compilation, so
      # a cross-built x86_64 wheel is named arm64 and delocate then refuses it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64"
          - os: macos-latest      # M1 runner: arm64
            archs: "arm64"
          - os: macos-15-intel    # Intel runner: native x86_64
            archs: "x86_64"
          - os: windows-latest
            archs: "AMD64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build cibuildwheel

      - name: Build sdist
        # Once: three legs writing the same sdist into dist/ would collide.
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --sdist --outdir dist/

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist/
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          # Linux: x86_64 only.  The aarch64 containers are ARM images and
          # cannot run on an x86_64 runner (cibuildwheel: "exec format
          # error"); using them needs docker/setup-qemu-action (slow) or a
          # native ARM runner.  Linux/ARM installs the sdist instead.
          CIBW_ARCHS: ${{ matrix.archs }}
          # No CIBW_TEST_COMMAND here: the wheels are verified after the build,
          # by the verify job, when dist/ actually exists.

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  verify:
    name: verify wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      # Every wheel of every leg is installed into a clean venv and run through
      # the whole suite: what users install is the wheel, not the checkout.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Pick the wheel for this interpreter
        shell: bash
        # `pip download --no-index` resolves biorazer against dist/ only, so a
        # wheel whose tag does not fit this platform/Python fails right here.
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          python -m pip download --no-deps --no-index --only-binary :all: --find-links dist/ "biorazer==$VERSION" -d wheel
          WHEEL="$(ls wheel/biorazer-*)"
          echo "verifying $WHEEL"
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"

      - name: Install the wheel into a clean venv
        shell: bash
        # `bash` on every runner, so the venv layout is the only difference.
        run: |
          python -m venv .verify
          # Absolute: the suite step cds into run/ before calling this, and a
          # relative path would then be "No such file or directory" (exit 127).
          VENV_PY="$PWD/.verify/bin/python"
          [ -f "$VENV_PY" ] || VENV_PY="$PWD/.verify/Scripts/python.exe"
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"
          # By path, so pip cannot substitute some released biorazer; the
          # runtime dependencies and pytest come from PyPI as usual.
          "$VENV_PY" -m pip install "$WHEEL" pytest

      - name: Check that the wheel carries its compiled extension
        shell: bash
        run: |
          "$VENV_PY" scripts/check_wheel.py

      - name: Run the whole suite against the installed wheel
        shell: bash
        # From a directory that does not contain the biorazer package: pytest
        # started in the checkout would import the source tree, and the run
        # would prove nothing about the wheel.
        run: |
          mkdir -p run && cp -r tests run/tests
          cd run
          "$VENV_PY" -m pytest tests/ -q

  publish:
    name: publish to PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The tag/version check below reads pyproject.toml from the working
      # directory, which only holds dist/ unless the repository is checked out.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Check tag/version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME != pyproject version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag/version consistent: $PACKAGE_VERSION"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
