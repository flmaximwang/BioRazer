[build-system]
requires = ["poetry-core", "setuptools", "cython", "numpy"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "biorazer"
description = "A platform for analyzing various biological information"
version = "0.8.1"
readme = "README.md"
license = "MIT"
authors = [
    "Fanlin Wang <flmaximwang@icloud.com>",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
]
packages = [
    { include = "biorazer" },
]

[tool.poetry.urls]
Homepage = "https://github.com/flmaximwang/BioRazer"
Repository = "https://github.com/flmaximwang/BioRazer"
Issues = "https://github.com/flmaximwang/BioRazer/issues"

[tool.poetry.dependencies]
python = "^3.11"
biotite = "^1.4.0"
biopython = "^1.80"
tabulate = "^0.9.0"
scipy = "^1.16.1"
numpy = "^2"
rdkit = ">=2024.3.5"
hydride = "^1.2.3"
umap-learn = "^0.5.9.post2"
rcsb-api = "^1.4.2"
matplotlib = "^3.7.2"
python-codon-tables = "^0.1.18"
pandas = "^2.2"

[tool.poetry.group.dev.dependencies]
cython = "^0.29.0"
pytest = "^8.0"
pytest-cov = "^5.0"

# Optional extra feature (see biorazer/structure/io/protein.py):
# - "pyrosetta": PyRosetta Pose adapters. PyRosetta is NOT on PyPI (licensing),
#   so this extra is an intent declaration only -- install PyRosetta yourself
#   (conda -c https://conda.rosettacommons.org -c conda-forge pyrosetta, or a
#   wheel from pyrosetta.org) before `pip install .[pyrosetta]` will resolve.
#   (biopython, used by the internal-coordinate adapters, is a core dependency.)
[tool.poetry.extras]
pyrosetta = ["pyrosetta"]

[tool.poetry.build]
script = "scripts/build.py"

[tool.poetry.scripts]
biorazer = "biorazer.cli:main"